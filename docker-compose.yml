services:
  samplexchange:
    image: ghcr.io/patrick-skowronek/samplexchange:latest
    environment:
      SOURCE_FORMAT: "MII_2025"
      TARGET_FORMAT: "BBMRI_DE"
      SOURCE_URL: http://blazea:8080/fhir
      SOURCE_DISABLE_SSL: true
      TARGET_DISABLE_SSL: true
      TARGET_URL: http://blazeb:8080/fhir
    networks:
      - samplexchange

networks:
  samplexchange:
    name: samplexchange
    external: true
